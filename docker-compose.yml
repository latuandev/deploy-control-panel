services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deploy_panel}
      POSTGRES_USER: ${POSTGRES_USER:-deploy_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deploy_panel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deploy_panel} -d ${POSTGRES_DB:-deploy_panel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-deploy_panel}:${POSTGRES_PASSWORD:-deploy_panel}@db:5432/${POSTGRES_DB:-deploy_panel}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TARGET_SSH_HOST: ${TARGET_SSH_HOST:-}
      TARGET_SSH_PORT: ${TARGET_SSH_PORT:-22}
      TARGET_SSH_USER: ${TARGET_SSH_USER:-tuanle}
      TARGET_SSH_KEY_PATH: ${TARGET_SSH_KEY_PATH:-/run/secrets/deploy_panel_key}
      TARGET_SSH_KEY_PASSPHRASE: ${TARGET_SSH_KEY_PASSPHRASE:-}
      TARGET_SSH_KNOWN_HOSTS: ${TARGET_SSH_KNOWN_HOSTS:-}
      TARGET_REMOTE_RUNNER: ${TARGET_REMOTE_RUNNER:-/opt/apps/scripts/run-deploy-job.sh}
      TARGET_REMOTE_LOG_DIR: ${TARGET_REMOTE_LOG_DIR:-/home/tuanle/logs/deploy}
      SSH_AUTO_ADD_HOST_KEY: ${SSH_AUTO_ADD_HOST_KEY:-true}
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

